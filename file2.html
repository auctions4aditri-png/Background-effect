<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>CSS Styling Examples</title>
  <!--Internal CSS-->
  <style>
  #abc{
    height:400px;
    background-color: lightpink;

 <!--External CSS-->

</head

</html>
