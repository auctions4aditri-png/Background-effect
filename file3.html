<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>CSS Styling Examples</title>
  <!--Internal CSS-->
  <style>
  @keyframes example{
    0% {background-color: palevioletred;}
    25% {background-color: hotpink;}
    50% {background-color: violet;}
    100% {background-color: lightskyblue;}
  }
    div{
      width:100px;
      height:100px;
      background-color: palevioletred;
      animation-name: example;
      animation-duration: 4s;
    }
  </style>
 <!--External CSS-->
  <link rel="stylesheet" href="style.css"/>
</head
<body>
<div>Aditri</div>
</body>
</html>
